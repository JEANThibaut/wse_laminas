name: Deploiement production

# Deploiement exclusivement manuel : Actions > Deploiement production >
# Run workflow. Un push, y compris sur main, ne met jamais en ligne.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulation : liste ce qui serait envoye, sans rien ecrire sur le serveur"
        type: boolean
        default: false
      full:
        description: "Envoi complet : resynchronise tout le serveur (sinon, seuls les fichiers modifies depuis le dernier deploiement)"
        type: boolean
        default: false

# Un seul deploiement a la fois : deux synchronisations concurrentes
# laisseraient le serveur dans un etat incoherent.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Build et envoi SFTP
    runs-on: ubuntu-latest
    # Un deploiement normal prend moins de 5 minutes : au-dela, quelque chose
    # bloque et le job ne doit pas tourner jusqu'a la limite de 6 h
    timeout-minutes: 15

    steps:
      - name: Recupere le code
        uses: actions/checkout@v4
        with:
          # Historique complet : l'envoi partiel compare avec Git le commit
          # deja deploye et celui-ci
          fetch-depth: 0

      - name: Installe PHP
        uses: shivammathur/setup-php@v2
        with:
          # Doit correspondre a la version PHP configuree sur l'hebergement OVH.
          php-version: ${{ vars.PHP_VERSION || '8.3' }}
          coverage: none

      - name: Cache des dependances Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ runner.os }}-php${{ vars.PHP_VERSION || '8.3' }}-${{ hashFiles('composer.lock') }}

      # --no-scripts : les scripts post-install de Laminas reecrivent la config
      # et tentent de vider un cache qui n'existe pas dans le runner.
      - name: Installe les dependances de production
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-progress --no-interaction --no-scripts

      - name: Verifie la syntaxe PHP des modules
        run: find module config public -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Prepare les dossiers runtime
        run: mkdir -p data/cache && touch data/cache/.gitkeep

      # Cles VAPID des notifications, depuis les secrets GitHub : evite d'editer
      # la config a la main sur le serveur. Laminas charge tout
      # config/autoload/*.global.php. Sans les deux secrets, aucun fichier :
      # les notifications restent desactivees.
      # Depot public : les journaux sont lisibles par tous. La cle publique peut
      # etre une variable (elle n'a rien de secret), la cle privee DOIT etre un
      # secret, seul type masque dans les journaux.
      - name: Genere la config des notifications
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY || vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          if [ -z "$VAPID_PUBLIC_KEY" ]; then
            echo "VAPID_PUBLIC_KEY absente (secret ou variable) : notifications desactivees"
            exit 0
          fi
          if [ -z "$VAPID_PRIVATE_KEY" ]; then
            echo "Secret VAPID_PRIVATE_KEY absent : notifications desactivees."
            echo "Il doit etre dans l'onglet Secrets (pas Variables) de Settings > Secrets and variables > Actions."
            exit 0
          fi
          # Valeurs lues par PHP depuis l'environnement et echappees par
          # var_export : aucune interpolation shell des cles
          php -r '
            $config = ["push" => ["vapid" => [
                "subject" => "mailto:contact@wolfsofteure.fr",
                "public_key" => getenv("VAPID_PUBLIC_KEY"),
                "private_key" => getenv("VAPID_PRIVATE_KEY"),
            ]]];
            file_put_contents("config/autoload/push.global.php",
                "<?php\n// Genere au deploiement depuis les secrets GitHub. Ne pas modifier.\nreturn " . var_export($config, true) . ";\n");
          '
          php -l config/autoload/push.global.php

      # Page Facebook (publication a la creation d'une partie), meme principe :
      # le jeton DOIT etre un secret, l'identifiant de la Page peut etre une
      # variable. Sans les deux, aucun fichier : la publication est desactivee.
      - name: Genere la config Facebook
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID || vars.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
        run: |
          if [ -z "$FACEBOOK_PAGE_ID" ] || [ -z "$FACEBOOK_PAGE_TOKEN" ]; then
            echo "FACEBOOK_PAGE_ID ou secret FACEBOOK_PAGE_TOKEN absent : publication Facebook desactivee"
            exit 0
          fi
          php -r '
            $config = ["facebook" => [
                "page_id" => getenv("FACEBOOK_PAGE_ID"),
                "token" => getenv("FACEBOOK_PAGE_TOKEN"),
            ]];
            file_put_contents("config/autoload/facebook.global.php",
                "<?php\n// Genere au deploiement depuis les secrets GitHub. Ne pas modifier.\nreturn " . var_export($config, true) . ";\n");
          '
          php -l config/autoload/facebook.global.php


      # L'hebergement OVH expose du SFTP (sous-systeme SSH, port 22), pas du
      # FTPS. lftp parle les deux. Reglages de connexion communs aux etapes
      # suivantes : sans limite, lftp reessaie indefiniment et en silence quand
      # la connexion echoue (mot de passe refuse, hote injoignable...).
      - name: Prepare la connexion SFTP
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp sshpass
          cat > "$RUNNER_TEMP/lftp-connect" <<'LFTP'
          set sftp:connect-program "sshpass -e ssh -a -x -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20"
          set net:max-retries 3
          set net:timeout 20
          set net:reconnect-interval-base 5
          LFTP

      # Commit deploye la derniere fois, ecrit sur le serveur a la fin de chaque
      # deploiement reussi. Absent ou illisible : envoi complet.
      - name: Lit le dernier commit deploye
        id: deployed
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PORT: ${{ vars.SFTP_PORT || '22' }}
          REMOTE_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          old=$( { cat "$RUNNER_TEMP/lftp-connect"; echo 'set cmd:fail-exit no'; echo "cat \"${REMOTE_DIR:-.}/.deployed-commit\""; echo 'bye'; } \
            | lftp -u "$SFTP_USER", "sftp://${SFTP_HOST}:${SFTP_PORT}" 2>/dev/null | tr -d '[:space:]' || true)
          if [[ "$old" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Dernier commit deploye : $old"
          else
            echo "Aucun commit deploye connu sur le serveur"
            old=""
          fi
          echo "commit=$old" >> "$GITHUB_OUTPUT"

      - name: Prepare l'envoi
        env:
          OLD_COMMIT: ${{ steps.deployed.outputs.commit }}
          FULL: ${{ inputs.full && 'true' || 'false' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          REMOTE_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: python3 .github/scripts/deploy-plan.py

      - name: Envoi SFTP
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PORT: ${{ vars.SFTP_PORT || '22' }}
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/deploy.lftp" ]; then
            echo "Rien a executer (simulation d'un envoi partiel : voir l'etape precedente)"
            exit 0
          fi
          echo "----- commandes -----"
          cat "$RUNNER_TEMP/deploy.lftp"
          echo "---------------------"
          { cat "$RUNNER_TEMP/lftp-connect" "$RUNNER_TEMP/deploy.lftp"; echo 'bye'; } | lftp -u "$SFTP_USER", "sftp://${SFTP_HOST}:${SFTP_PORT}"
