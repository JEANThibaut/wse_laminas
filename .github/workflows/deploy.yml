name: Deploiement production

# Declenche a chaque push sur main, ou manuellement depuis l'onglet Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulation : liste ce qui serait envoye, sans rien ecrire sur le serveur"
        type: boolean
        default: false

# Un seul deploiement a la fois : deux synchronisations concurrentes
# laisseraient le serveur dans un etat incoherent.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Build et envoi SFTP
    runs-on: ubuntu-latest

    steps:
      - name: Recupere le code
        uses: actions/checkout@v4

      - name: Installe PHP
        uses: shivammathur/setup-php@v2
        with:
          # Doit correspondre a la version PHP configuree sur l'hebergement OVH.
          php-version: ${{ vars.PHP_VERSION || '8.3' }}
          coverage: none

      - name: Cache des dependances Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ runner.os }}-php${{ vars.PHP_VERSION || '8.3' }}-${{ hashFiles('composer.lock') }}

      # --no-scripts : les scripts post-install de Laminas reecrivent la config
      # et tentent de vider un cache qui n'existe pas dans le runner.
      - name: Installe les dependances de production
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-progress --no-interaction --no-scripts

      - name: Verifie la syntaxe PHP des modules
        run: find module config public -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Prepare les dossiers runtime
        run: mkdir -p data/cache && touch data/cache/.gitkeep

      # L'hebergement OVH expose du SFTP (sous-systeme SSH, port 22), pas du
      # FTPS. lftp parle les deux et fait de la synchronisation incrementale :
      # seuls les fichiers dont la taille ou la date ont change sont transmis.
      - name: Envoi SFTP
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PORT: ${{ vars.SFTP_PORT || '22' }}
          REMOTE_DIR: ${{ vars.FTP_SERVER_DIR }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp sshpass

          # --delete supprime cote serveur ce qui a disparu du repo. Les
          # exclusions ci-dessous protegent les fichiers qui n'existent QUE sur
          # le serveur : les retirer entrainerait une perte de donnees.
          lftp -u "$SFTP_USER", "sftp://${SFTP_HOST}:${SFTP_PORT}" <<LFTP
          set sftp:connect-program "sshpass -e ssh -a -x -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          set net:max-retries 3
          set net:timeout 20
          set mirror:parallel-transfer-count 4
          mirror --reverse --delete --verbose $DRY_RUN \
            --exclude '^\.git' \
            --exclude '^\.github/' \
            --exclude '^\.vscode/' \
            --exclude '^EN-PROD/' \
            --exclude '^doc/' \
            --exclude '^bin/' \
            --exclude '/test/' \
            --exclude '/tests/' \
            --exclude '\.md$' \
            --exclude '\.dist$' \
            --exclude '^config/autoload/local\.php$' \
            --exclude '^config/autoload/global\.php$' \
            --exclude '^config/autoload/.*\.local\.php$' \
            --exclude '^config/development\.config\.php$' \
            --exclude '^data/sessions/' \
            --exclude '^public/photos/' \
            --exclude '^public/diag\.php$' \
            --exclude '^Dockerfile$' \
            --exclude '^docker-compose\.yml$' \
            --exclude '^phpcs\.xml$' \
            --exclude '^phpunit\.xml\.dist$' \
            --exclude '^psalm\.xml$' \
            --exclude '^renovate\.json$' \
            --exclude '^\.phpstorm\.meta\.php$' \
            --exclude '^\.psalm-stubs\.phpstub$' \
            ./ "$REMOTE_DIR"
          bye
          LFTP

      # Le cache de config Laminas est actif en prod (config_cache_enabled = true
      # dans config/application.config.php). Sans cette purge, toute modification
      # de route, de factory ou de module.config.php resterait sans effet.
      - name: Vide le cache de configuration Laminas
        if: ${{ !inputs.dry_run }}
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PORT: ${{ vars.SFTP_PORT || '22' }}
          REMOTE_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail
          lftp -u "$SFTP_USER", "sftp://${SFTP_HOST}:${SFTP_PORT}" <<LFTP
          set sftp:connect-program "sshpass -e ssh -a -x -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          cd "$REMOTE_DIR"
          glob -a rm -f data/cache/*.php
          bye
          LFTP
